    <!--3) create username-->
    <div class="Section">
        <h2>create username</h2>
        <input type="text" id="firstname" placeholder="firstname">
        <input type="text" id="lastname" placeholder="lastname">
        <input type="number" id="age" placeholder="Age">

        <Button onclick=" generateUsername()">Generate username</Button>

        <p id="UsernameResult"></p>

    </div>

    <script>


        function generateUsername(){
            const f = document.getElementById("firstname").value.trim().toLowerCase();
            const l = document.getElementById("lastname").value.trim().toLowerCase();
         const age = document.getElementById("age").value;

         if (f.length<2 || l.length<2 || !age){
            document.getElementById('UsernameResult').innerText="enter valid data";
            return;
        
        }
        const uname=f.substring(0,2)+l.slice(-2)+age;
        document.getElementById('UsernameResult').innerText="username:"+uname;
        
    
    }
    </script>
    <div></div>
</body>
